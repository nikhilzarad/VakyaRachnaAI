version: 1
frontend:
  phases:
    preBuild:
      commands:
        - export NVM_DIR="$HOME/.nvm"
        - . "$NVM_DIR/nvm.sh"
        - nvm install 22.22.3
        - nvm use 22.22.3
        - node -v
        - npm -v
        - npm install --no-fund --no-audit --cache .npm --prefer-offline
    build:
      commands:
        - export NVM_DIR="$HOME/.nvm"
        - . "$NVM_DIR/nvm.sh"
        - nvm use 22.22.3
        - |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            groqApiKey: "${GROQ_API_KEY}",
          };
          EOF
        - npm run build
  artifacts:
    baseDirectory: dist/vakyaRachna-ai-writing-assistant/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**
