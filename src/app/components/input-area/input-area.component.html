<div class="flex flex-col gap-2 lg:gap-3">
  <div class="flex items-center justify-end">
    <div class="flex items-center gap-1 lg:gap-2">
      @if (inputText) {
        <span class="badge badge-secondary text-xs px-2 py-0.5">
          {{ wordCount }} {{ wordCount === 1 ? 'word' : 'words' }}
        </span>
        <span class="badge badge-secondary text-xs px-2 py-0.5">
          {{ charCount }} {{ charCount === 1 ? 'char' : 'chars' }}
        </span>
        <button
          type="button"
          class="text-xs h-7 px-2 text-muted-foreground hover:text-destructive"
          (click)="handleClear()"
          >
          Clear
        </button>
      }
    </div>
  </div>

  <div class="space-y-2">
    <p class="text-sm font-semibold uppercase tracking-[0.35em] text-muted-foreground">Your Text</p>
    <p class="text-sm text-muted-foreground">Paste or type your text, then choose an action to transform it.</p>
  </div>

  <textarea
    #textarea
    [value]="inputText"
    (input)="handleChange($event)"
    (paste)="handlePaste()"
    placeholder="Paste or type your text here..."
    class="min-h-[220px] lg:min-h-[260px] resize-none text-sm leading-relaxed bg-white/5 border border-white/10 text-foreground placeholder:text-muted-foreground/40 focus:border-primary focus:bg-white/10 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all duration-200 rounded-[28px] w-full p-5 text-base text-white text-opacity-90 shadow-inner text-sm"
  ></textarea>
</div>
